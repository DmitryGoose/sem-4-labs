<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КубаньАрхеология | Артефакты</title>
    <!-- Шрифты как на основном сайте -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('https://kubarheology.ru/wp-content/uploads/2023/bg-mountains.jpg');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: #eee;
            font-family: 'Roboto', sans-serif;
            margin: 0;
        }
        .header {
            background-color: #1a1a1a;
            border-bottom: 1px solid #d4af37;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #d4af37;
            text-decoration: none;
            font-size: 24px;
        }
        .logo span {
            color: #00a0e3;
            font-style: italic;
            font-size: 14px;
        }
        nav a {
            color: #ccc;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 14px;
        }
        nav a.active {
            border-bottom: 2px solid #d4af37;
            color: #d4af37;
        }
        .card {
            background-color: #2a2a2a;
            color: #eee;
            border: 1px solid #d4af37;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            border-bottom: 1px solid #d4af37;
            height: 200px;
            object-fit: cover;
        }
        .card-title {
            font-family: 'Playfair Display', serif;
            color: #d4af37;
        }
        .btn-primary {
            background-color: #00a0e3;
            border: none;
        }
        .btn-primary:hover {
            background-color: #008ac4;
        }
        .btn-outline-light {
            border-color: #d4af37;
            color: #d4af37;
        }
        .btn-outline-light:hover {
            background-color: #d4af37;
            color: #000;
        }
        .detail-card {
            background-color: #1e1e1e;
            border: 1px solid #d4af37;
        }
        .toast-container { z-index: 1100; }
        .toast {
            background-color: #2d2d2d;
            color: #fff;
            border-left: 4px solid #d4af37;
        }
        .toast-header {
            background-color: #1a1a1a;
            color: #d4af37;
            border-bottom: 1px solid #444;
        }
        .btn-close { filter: invert(1); }
        footer {
            background-color: #1a1a1a;
            border-top: 1px solid #d4af37;
            padding: 20px;
            text-align: center;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Шапка в стиле КубаньАрхеология -->
    <header class="header">
        <a href="/" class="logo">
            ⚱️ КУБАНЬАРХЕОЛОГИЯ
            <span>est. 2026</span>
        </a>
        <nav>
            <a href="index.html" class="active">КАТАЛОГ</a>
            <a href="calculator.html">КАЛЬКУЛЯТОР</a>
        </nav>
    </header>

    <!-- Корневой элемент для JS -->
    <div id="root" class="container py-4"></div>

    <!-- Подвал -->
    <footer>
        Сделано в рамках лабораторных работ. Данные предоставлены КубаньАрхеология.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="bundle.js"></script>
</body>
</html>
